<!doctype html>
<html lang="pt-BR">
  <head>
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "z5d28hd9xw");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuPair Hub</title>

    <style>
      /* Bloqueia a barra do Google Chrome e pop-ups sem travar a navegação */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-tooltip {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
        opacity: 0 !important;
      }

      html, body {
        top: 0px !important;
        position: static !important;
        margin-top: 0px !important;
      }

      /* Elemento do Google completamente oculto visualmente */
      #google_translate_element {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Elemento oculto apenas para o motor de tradução rodar em segundo plano -->
    <div id="google_translate_element"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'pt',
          includedLanguages: 'en,es,de,fr,it',
          autoDisplay: false
        }, 'google_translate_element');

        // TRADUÇÃO AUTOMÁTICA IMEDIATA: Detecta o idioma do celular/browser do visitante
        setTimeout(function() {
          var userLang = navigator.language || navigator.userLanguage;
          if (userLang && !userLang.startsWith('pt')) {
            var targetLang = userLang.substring(0, 2);
            var select = document.querySelector('.goog-te-combo');
            if (select) {
              select.value = targetLang;
              select.dispatchEvent(new Event('change'));
            }
          }
        }, 500);
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
