<!doctype html>
<html lang="pt-BR">
  <head>
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "z5d28hd9xw");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuPair Hub</title>

    <style>
      /* Evita que a barra do Google empurre a página */
      body {
        top: 0px !important;
        position: static !important;
      }
      .goog-te-banner-frame {
        display: none !important;
      }
      
      /* Barra simples no topo */
      .top-lang-bar {
        width: 100%;
        background-color: #f8f9fa;
        border-bottom: 1px solid #e9ecef;
        padding: 6px 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
      }
    </style>
  </head>
  <body>

    <!-- Barra de Idiomas Simples -->
    <div class="top-lang-bar">
      <span>🌐 Idioma / Language:</span>
      <div id="google_translate_element"></div>
    </div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'pt',
          includedLanguages: 'en,es,de,fr,it',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
