<!doctype html>
<html lang="pt-BR">
  <head>
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "z5d28hd9xw");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuPair Hub</title>

    <style>
      /* Esconde a barra superior do Google Translate que aparece na imagem */
      .goog-te-banner-frame.skiptranslate, 
      .goog-te-banner-frame, 
      iframe.goog-te-banner-frame {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
      }

      /* Impede que o Google empurre o corpo da página para baixo */
      body {
        top: 0px !important;
        position: static !important;
      }

      /* Remove o ícone e elementos desnecessários da caixa */
      .goog-te-gadget-icon, 
      .goog-te-gadget img {
        display: none !important;
      }

      /* Estilização limpa e compacta do seletor */
      .goog-te-gadget-simple {
        background-color: #ffffff !important;
        border: 1px solid #d0d7de !important;
        padding: 2px 8px !important;
        border-radius: 12px !important;
        font-size: 11px !important;
        line-height: 1.2 !important;
        height: 24px !important;
        display: inline-flex !important;
        align-items: center !important;
      }

      .goog-te-menu-value span {
        font-size: 11px !important;
        color: #444 !important;
      }
    </style>
  </head>
  <body>
    <!-- Barra de Idioma Compacta -->
    <div style="width: 100%; background: #f0f4f8; border-bottom: 1px solid #d0d7de; padding: 4px 8px; text-align: center; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 12px; font-family: sans-serif; margin-right: 6px; color: #444;">🌐 Language:</span>
      <div id="google_translate_element" style="display: inline-block;"></div>
    </div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'pt',
          includedLanguages: 'en,es,de,fr,it',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');

        setTimeout(function() {
          var userLang = navigator.language || navigator.userLanguage;
          if (userLang && !userLang.startsWith('pt')) {
            var select = document.querySelector('.goog-te-combo');
            if (select) {
              var targetLang = userLang.substring(0, 2);
              select.value = targetLang;
              select.dispatchEvent(new Event('change'));
            }
          }
        }, 1000);
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
