<!doctype html>
<html lang="pt-BR">
  <head>
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "z5d28hd9xw");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuPair Hub</title>
  </head>
  <body>
    <!-- Barra de Idioma no Topo com Detecção Automática -->
<div style="width: 100%; background: #f0f4f8; border-bottom: 1px solid #d0d7de; padding: 8px; text-align: center;">
  <span style="font-size: 13px; font-family: sans-serif; margin-right: 6px; color: #333;">🌐 Language / Idioma:</span>
  <div id="google_translate_element" style="display: inline-block;"></div>
</div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'pt',
      includedLanguages: 'en,es,de,fr,it',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
      autoDisplay: false
    }, 'google_translate_element');

    // Tradução automática baseada no idioma do sistema/navegador
    setTimeout(function() {
      var userLang = navigator.language || navigator.userLanguage;
      if (userLang && !userLang.startsWith('pt')) {
        var select = document.querySelector('.goog-te-combo');
        if (select) {
          var targetLang = userLang.substring(0, 2);
          select.value = targetLang;
          select.dispatchEvent(new Event('change'));
        }
      }
    }, 1000);
  }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<style>
  .goog-te-banner-frame { display: none !important; }
  body { top: 0px !important; position: static !important; }
  .goog-te-gadget-icon { display: none !important; }
  .goog-te-gadget-simple {
    background-color: #ffffff !important;
    border: 1px solid #ccc !important;
    padding: 4px 10px !important;
    border-radius: 16px !important;
    font-size: 13px !important;
  }
</style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</body>
</html>
