<!doctype html>
<html lang="pt-BR">
  <head>
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "z5d28hd9xw");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuPair Hub</title>

    <style>
      /* Bloqueia totalmente a injeção do banner nativo do Google Chrome */
      html {
        margin-top: 0px !important;
      }
      
      body {
        top: 0px !important;
        position: static !important;
      }

      .goog-te-banner-frame, 
      .goog-te-banner,
      iframe[id^=":"] {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
      }

      /* Oculta os elementos nativos do widget */
      #google_translate_element,
      .goog-te-spinner-pos,
      .goog-te-balloon-frame {
        display: none !important;
      }

      /* Barra de Idiomas Moderna */
      .lang-bar-container {
        width: 100%;
        background-color: #f8f9fa;
        border-bottom: 1px solid #e9ecef;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        color: #333;
        box-sizing: border-box;
      }

      .lang-btn {
        background: #ffffff;
        border: 1px solid #ced4da;
        border-radius: 16px;
        padding: 4px 12px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        color: #495057;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        background: #e9ecef;
        border-color: #adb5bd;
      }
    </style>
  </head>
  <body>

    <!-- Barra de Idiomas Superior -->
    <div class="lang-bar-container">
      <span>🌐 Language:</span>
      <button class="lang-btn" onclick="changeLanguage('pt')">🇧🇷 PT</button>
      <button class="lang-btn" onclick="changeLanguage('en')">🇺🇸 EN</button>
      <button class="lang-btn" onclick="changeLanguage('es')">🇪🇸 ES</button>
      <button class="lang-btn" onclick="changeLanguage('de')">🇩🇪 DE</button>
    </div>

    <div id="google_translate_element"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'pt',
          includedLanguages: 'en,es,de,fr,it',
          layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL,
          autoDisplay: false
        }, 'google_translate_element');

        // Detecção automática silenciosa
        setTimeout(function() {
          var userLang = navigator.language || navigator.userLanguage;
          if (userLang && !userLang.startsWith('pt')) {
            var targetLang = userLang.substring(0, 2);
            changeLanguage(targetLang);
          }
        }, 1200);
      }

      function changeLanguage(langCode) {
        var select = document.querySelector('.goog-te-combo');
        if (select) {
          select.value = langCode;
          select.dispatchEvent(new Event('change'));
        }
      }
    </script>

    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
