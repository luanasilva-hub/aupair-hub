<!doctype html>
<html lang="pt-BR">
  <head>
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "z5d28hd9xw");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuPair Hub</title>

    <style>
      /* Esconde completamente as barras nativas e banners do Google Translate */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        opacity: 0 !important;
      }

      body {
        top: 0px !important;
        position: static !important;
      }

      /* Oculta o widget padrão feio do Google */
      #google_translate_element {
        display: none !important;
      }

      /* Estilo da barra de idioma limpa do Au Pair Hub */
      .custom-lang-bar {
        width: 100%;
        background: #f8f9fa;
        border-bottom: 1px solid #e9ecef;
        padding: 6px 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
      }

      .lang-btn {
        background: transparent;
        border: 1px solid #ced4da;
        border-radius: 14px;
        padding: 3px 10px;
        cursor: pointer;
        font-size: 12px;
        color: #495057;
        transition: all 0.2s ease;
      }

      .lang-btn:hover {
        background: #e9ecef;
        color: #212529;
      }
    </style>
  </head>
  <body>
    <!-- Seletor de Idioma Customizado e Limpo -->
    <div class="custom-lang-bar">
      <span>🌐 Idioma / Language:</span>
      <button class="lang-btn" onclick="translatePage('pt')">🇧🇷 PT</button>
      <button class="lang-btn" onclick="translatePage('en')">🇺🇸 EN</button>
      <button class="lang-btn" onclick="translatePage('es')">🇪🇸 ES</button>
      <button class="lang-btn" onclick="translatePage('de')">🇩🇪 DE</button>
    </div>

    <!-- Elemento oculto do Google para processar a tradução -->
    <div id="google_translate_element"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'pt',
          includedLanguages: 'en,es,de,fr,it',
          autoDisplay: false
        }, 'google_translate_element');

        // Detecção automática sem disparar o banner feio do Google
        setTimeout(function() {
          var userLang = navigator.language || navigator.userLanguage;
          if (userLang && !userLang.startsWith('pt')) {
            var langCode = userLang.substring(0, 2);
            translatePage(langCode);
          }
        }, 800);
      }

      function translatePage(langCode) {
        var select = document.querySelector('.goog-te-combo');
        if (select) {
          select.value = langCode;
          select.dispatchEvent(new Event('change'));
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
